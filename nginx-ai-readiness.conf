# ─────────────────────────────────────────────────────────────────────────────
# Nginx server blocks for the AI Readiness micro-site
# Served on its own subdomain, matching the canonical URLs in the HTML:
#   https://aireadiness.netscribes.com/            → base/
#   https://aireadiness.netscribes.com/bfsi/       → bfsi/
#   https://aireadiness.netscribes.com/automotive/ → automotive/
#   https://aireadiness.netscribes.com/retail/     → retail/
#   https://aireadiness.netscribes.com/healthcare/ → healthcare/
#   https://aireadiness.netscribes.com/ict/        → ict/
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name aireadiness.netscribes.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name aireadiness.netscribes.com;
    ssl_certificate     /etc/letsencrypt/live/aireadiness.netscribes.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aireadiness.netscribes.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /var/www/ai-readiness;

    # ── Shared JS/CSS assets (referenced as /shared/… from every page) ─────────
    location /shared/ {
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options nosniff;
    }

    # ── Base (industry-agnostic) served at the root ────────────────────────────
    location = / {
        try_files /base/index.html =404;
        add_header Cache-Control "public, max-age=3600";
    }

    # ── Industry variants at /<industry>/ ──────────────────────────────────────
    location ~ ^/(automotive|bfsi|retail|healthcare|ict)/$ {
        try_files $uri${uri}index.html /$1/index.html =404;
        add_header Cache-Control "public, max-age=3600";
    }

    # ── Trailing-slash redirects (/bfsi → /bfsi/) ──────────────────────────────
    location ~ ^/(automotive|bfsi|retail|healthcare|ict)$ {
        return 301 $uri/;
    }

    # ── Fallback ───────────────────────────────────────────────────────────────
    location / { try_files $uri $uri/ =404; }
}
