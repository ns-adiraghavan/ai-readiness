# ─────────────────────────────────────────────────────────────────────────────
# Nginx location blocks for AI Readiness micro-site
# If you already have a server{} block for netscribes.com, add only the
# location{} sections into your existing block.
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name netscribes.com www.netscribes.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name netscribes.com www.netscribes.com;
    ssl_certificate     /etc/letsencrypt/live/netscribes.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/netscribes.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # ── Shared JS assets ──────────────────────────────────────────────────────
    location /ai-readiness/shared/ {
        alias /var/www/ai-readiness/shared/;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options nosniff;
    }

    # ── Base (industry-agnostic) ───────────────────────────────────────────────
    location = /ai-readiness/ {
        alias /var/www/ai-readiness/base/;
        try_files index.html =404;
        add_header Cache-Control "public, max-age=3600";
    }

    # ── Industry variants ──────────────────────────────────────────────────────
    location = /ai-readiness/automotive/ {
        alias /var/www/ai-readiness/automotive/;
        try_files index.html =404;
        add_header Cache-Control "public, max-age=3600";
    }
    location = /ai-readiness/bfsi/ {
        alias /var/www/ai-readiness/bfsi/;
        try_files index.html =404;
        add_header Cache-Control "public, max-age=3600";
    }
    location = /ai-readiness/retail/ {
        alias /var/www/ai-readiness/retail/;
        try_files index.html =404;
        add_header Cache-Control "public, max-age=3600";
    }
    location = /ai-readiness/healthcare/ {
        alias /var/www/ai-readiness/healthcare/;
        try_files index.html =404;
        add_header Cache-Control "public, max-age=3600";
    }
    location = /ai-readiness/ict/ {
        alias /var/www/ai-readiness/ict/;
        try_files index.html =404;
        add_header Cache-Control "public, max-age=3600";
    }

    # ── Trailing-slash redirects ───────────────────────────────────────────────
    location ~ ^/ai-readiness/(automotive|bfsi|retail|healthcare|ict)$ {
        return 301 $uri/;
    }
    location = /ai-readiness {
        return 301 /ai-readiness/;
    }

    root /var/www/html;
    location / { try_files $uri $uri/ =404; }
}
